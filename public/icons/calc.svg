<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Windows 3.1 Calculator Icon -->
  <rect x="5" y="3" width="22" height="26" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
  <!-- LCD Screen -->
  <rect x="7" y="5" width="18" height="6" fill="#d0dcd0" stroke="#000" stroke-width="1"/>
  <text x="21" y="10" font-size="5" font-family="monospace" font-weight="bold" fill="#000">0.</text>
  <!-- Keypad buttons grid -->
  <rect x="7" y="13" width="3" height="3" fill="#800000"/>
  <rect x="12" y="13" width="3" height="3" fill="#800000"/>
  <rect x="17" y="13" width="3" height="3" fill="#000080"/>
  <rect x="22" y="13" width="3" height="3" fill="#000080"/>

  <rect x="7" y="18" width="3" height="3" fill="#000080"/>
  <rect x="12" y="18" width="3" height="3" fill="#000080"/>
  <rect x="17" y="18" width="3" height="3" fill="#000080"/>
  <rect x="22" y="18" width="3" height="3" fill="#000080"/>

  <rect x="7" y="23" width="3" height="3" fill="#000080"/>
  <rect x="12" y="23" width="3" height="3" fill="#000080"/>
  <rect x="17" y="23" width="3" height="3" fill="#000080"/>
  <rect x="22" y="23" width="3" height="3" fill="#000080"/>
</svg>
