<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Shareware CD-ROM Icon -->
  <rect x="2" y="3" width="28" height="26" fill="#e8e8e8" stroke="#000" stroke-width="1"/>
  <!-- Jewel Case spine -->
  <rect x="2" y="3" width="3" height="26" fill="#404040"/>
  <!-- CD Disc circle -->
  <circle cx="17" cy="16" r="11" fill="#silver" stroke="#000" stroke-width="1"/>
  <circle cx="17" cy="16" r="9" fill="#e0e8f0"/>
  <!-- Holographic sheen -->
  <path d="M 17,7 A 9,9 0 0,1 25,20 L 21,18 A 5,5 0 0,0 17,11 Z" fill="#ffd700" opacity="0.6"/>
  <path d="M 9,20 A 9,9 0 0,1 12,9 L 14,13 A 5,5 0 0,0 13,18 Z" fill="#00ffff" opacity="0.6"/>
  <!-- Center hub and hole -->
  <circle cx="17" cy="16" r="4" fill="#ffffff" stroke="#808080"/>
  <circle cx="17" cy="16" r="2" fill="#e8e8e8" stroke="#000"/>
</svg>
