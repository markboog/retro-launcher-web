<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Windows 3.1 Program Manager Group Icon -->
  <rect x="3" y="3" width="26" height="26" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
  <!-- Mini titlebar -->
  <rect x="4" y="4" width="24" height="4" fill="#000080"/>
  <!-- 4 mini application icons inside the window -->
  <rect x="6" y="11" width="8" height="8" fill="#ffff00" stroke="#000"/>
  <rect x="7" y="12" width="6" height="6" fill="#ff0000"/>
  <rect x="18" y="11" width="8" height="8" fill="#00ff00" stroke="#000"/>
  <rect x="19" y="12" width="6" height="6" fill="#0000ff"/>
  <rect x="6" y="21" width="8" height="6" fill="#00ffff" stroke="#000"/>
  <rect x="18" y="21" width="8" height="6" fill="#ff00ff" stroke="#000"/>
</svg>
