<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Windows 3.1 Control Panel -->
  <rect x="4" y="5" width="24" height="22" rx="2" fill="#d0d0d0" stroke="#000" stroke-width="1"/>
  <!-- Top display -->
  <rect x="7" y="8" width="18" height="4" fill="#000080"/>
  <!-- Sliders / Dials -->
  <line x1="8" y1="16" x2="24" y2="16" stroke="#808080" stroke-width="2"/>
  <rect x="12" y="14" width="4" height="6" fill="#ffff00" stroke="#000"/>
  <line x1="8" y1="23" x2="24" y2="23" stroke="#808080" stroke-width="2"/>
  <rect x="18" y="21" width="4" height="6" fill="#00ffff" stroke="#000"/>
</svg>
