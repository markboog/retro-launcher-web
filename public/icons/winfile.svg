<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Windows 3.1 File Manager (Cabinet) -->
  <rect x="5" y="3" width="22" height="26" fill="#c0c0c0" stroke="#000" stroke-width="1"/>
  <!-- Top drawer -->
  <rect x="7" y="5" width="18" height="10" fill="#dfdfdf" stroke="#808080" stroke-width="1"/>
  <rect x="13" y="9" width="6" height="2" fill="#808080"/>
  <circle cx="16" cy="12" r="1" fill="#000"/>
  <!-- Bottom drawer -->
  <rect x="7" y="17" width="18" height="10" fill="#dfdfdf" stroke="#808080" stroke-width="1"/>
  <rect x="13" y="21" width="6" height="2" fill="#808080"/>
  <circle cx="16" cy="24" r="1" fill="#000"/>
  <!-- File peeking out of top drawer -->
  <polygon points="9,5 9,2 17,2 19,4 19,5" fill="#ffffff" stroke="#000"/>
</svg>
