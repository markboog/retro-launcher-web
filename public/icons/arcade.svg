<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Arcade Cabinet / Joystick -->
  <polygon points="5,3 27,3 24,10 8,10" fill="#181818" stroke="#000"/>
  <rect x="7" y="4" width="18" height="5" fill="#ffcc00"/>
  <text x="9" y="8" font-size="4" font-family="monospace" fill="#000" font-weight="bold">ARCADE</text>
  <!-- CRT screen -->
  <polygon points="8,10 24,10 26,20 6,20" fill="#002244" stroke="#000"/>
  <rect x="10" y="12" width="12" height="6" fill="#0088cc"/>
  <circle cx="16" cy="15" r="2" fill="#ffff00"/>
  <!-- Control Panel -->
  <polygon points="6,20 26,20 28,26 4,26" fill="#404040" stroke="#000"/>
  <!-- Joystick Ball Top -->
  <line x1="11" y1="23" x2="11" y2="19" stroke="#ffffff" stroke-width="2"/>
  <circle cx="11" cy="18" r="2.5" fill="#ff0000"/>
  <!-- Buttons -->
  <circle cx="17" cy="22" r="1.5" fill="#0000ff"/>
  <circle cx="21" cy="22" r="1.5" fill="#ff0000"/>
  <circle cx="25" cy="22" r="1.5" fill="#00ff00"/>
  <!-- Lower Cabinet -->
  <rect x="6" y="26" width="20" height="5" fill="#202020" stroke="#000"/>
  <rect x="14" y="27" width="4" height="3" fill="#808080"/>
</svg>
