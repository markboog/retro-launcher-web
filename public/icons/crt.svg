<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- CRT Monitor Icon -->
  <rect x="3" y="3" width="26" height="20" rx="2" fill="#d8d4c8" stroke="#000" stroke-width="1"/>
  <!-- Bezel and Glass -->
  <rect x="5" y="5" width="22" height="15" rx="1" fill="#101820" stroke="#000" stroke-width="1"/>
  <!-- Screen Glow -->
  <rect x="7" y="7" width="18" height="11" fill="#00ffff" opacity="0.8"/>
  <rect x="8" y="8" width="16" height="9" fill="#002244"/>
  <line x1="9" y1="10" x2="15" y2="10" stroke="#00ff66"/>
  <line x1="9" y1="12" x2="21" y2="12" stroke="#00ff66"/>
  <!-- Power button -->
  <circle cx="25" cy="21" r="1" fill="#00ff00"/>
  <!-- Stand -->
  <polygon points="12,23 20,23 22,27 10,27" fill="#bcbaa8" stroke="#000"/>
  <rect x="8" y="27" width="16" height="2" fill="#a4a292" stroke="#000"/>
</svg>
