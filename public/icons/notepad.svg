<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Windows 3.1 Notepad Icon -->
  <rect x="5" y="4" width="22" height="25" fill="#fdfdfd" stroke="#000" stroke-width="1"/>
  <!-- Top spiral / header -->
  <rect x="5" y="4" width="22" height="4" fill="#000080"/>
  <!-- Ruled lines -->
  <line x1="8" y1="12" x2="24" y2="12" stroke="#8080ff"/>
  <line x1="8" y1="16" x2="24" y2="16" stroke="#8080ff"/>
  <line x1="8" y1="20" x2="24" y2="20" stroke="#8080ff"/>
  <line x1="8" y1="24" x2="19" y2="24" stroke="#8080ff"/>
  <!-- Pencil -->
  <polygon points="21,14 26,9 28,11 23,16" fill="#ffd700" stroke="#000"/>
  <polygon points="20,15 21,14 23,16 21,17" fill="#f0d0b0" stroke="#000"/>
  <polygon points="19,16 20,15 21,17 19,18" fill="#000000"/>
</svg>
