<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Original Game Boy DMG-01 -->
  <rect x="6" y="2" width="20" height="28" rx="2" fill="#d0d0c8" stroke="#000" stroke-width="1"/>
  <!-- Curved bottom right -->
  <polygon points="22,30 26,26 26,30" fill="#008080"/>
  <!-- Screen bezel -->
  <rect x="8" y="4" width="16" height="12" rx="1" fill="#808080" stroke="#000" stroke-width="1"/>
  <!-- LCD Dot Matrix Screen -->
  <rect x="10" y="6" width="12" height="8" fill="#8ba300" stroke="#000" stroke-width="1"/>
  <rect x="9" y="8" width="1" height="2" fill="#ff0000"/>
  <!-- D-Pad -->
  <rect x="9" y="19" width="6" height="2" fill="#000"/>
  <rect x="11" y="17" width="2" height="6" fill="#000"/>
  <!-- A & B Buttons (Magenta) -->
  <circle cx="21" cy="20" r="1.5" fill="#a00060"/>
  <circle cx="23" cy="18" r="1.5" fill="#a00060"/>
  <!-- Start & Select -->
  <line x1="12" y1="26" x2="14" y2="25" stroke="#606060" stroke-width="1"/>
  <line x1="16" y1="26" x2="18" y2="25" stroke="#606060" stroke-width="1"/>
</svg>
