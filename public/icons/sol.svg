<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Solitaire Card Deck Icon -->
  <rect x="4" y="6" width="18" height="23" rx="2" fill="#000080" stroke="#000" stroke-width="1"/>
  <!-- Second Card -->
  <rect x="8" y="4" width="18" height="23" rx="2" fill="#ffffff" stroke="#000" stroke-width="1"/>
  <rect x="9" y="5" width="16" height="21" fill="#008000"/>
  <!-- Top Card (Ace of Spades) -->
  <rect x="11" y="2" width="18" height="24" rx="2" fill="#ffffff" stroke="#000" stroke-width="1"/>
  <text x="13" y="9" font-size="6" font-family="sans-serif" font-weight="bold" fill="#000">A</text>
  <!-- Spade symbol -->
  <path d="M 20,11 Q 20,8 18,8 Q 16,8 16,11 Q 16,15 20,17 Q 24,15 24,11 Q 24,8 22,8 Q 20,8 20,11 Z" fill="#000000" transform="rotate(180 20 12) translate(0, -6)"/>
  <polygon points="19,16 21,16 21,19 19,19" fill="#000000"/>
</svg>
