<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- Windows 3.1 Clock Icon -->
  <circle cx="16" cy="16" r="13" fill="#ffffff" stroke="#000" stroke-width="2"/>
  <circle cx="16" cy="16" r="11" fill="#ffffff" stroke="#808080" stroke-width="1"/>
  <!-- Hour tick marks -->
  <line x1="16" y1="6" x2="16" y2="8" stroke="#000" stroke-width="1.5"/>
  <line x1="16" y1="24" x2="16" y2="26" stroke="#000" stroke-width="1.5"/>
  <line x1="6" y1="16" x2="8" y2="16" stroke="#000" stroke-width="1.5"/>
  <line x1="24" y1="16" x2="26" y2="16" stroke="#000" stroke-width="1.5"/>
  <!-- Clock hands -->
  <!-- Hour hand (at ~10) -->
  <line x1="16" y1="16" x2="11" y2="11" stroke="#000" stroke-width="2.5"/>
  <!-- Minute hand (at ~2) -->
  <line x1="16" y1="16" x2="21" y2="9" stroke="#000" stroke-width="1.5"/>
  <!-- Center pin -->
  <circle cx="16" cy="16" r="2" fill="#ff0000"/>
</svg>
